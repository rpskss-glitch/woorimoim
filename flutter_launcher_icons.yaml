# 앱 아이콘 만들기 — 웹앱과 같은 아이콘을 쓴다 (회원들이 같은 아이콘으로 알아보게)
# 고치고 나서: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true          # 아이폰은 투명한 아이콘을 거부한다
  adaptive_icon_background: "#F3F9FF"
  adaptive_icon_foreground: "assets/icon.png"

# 🔎 러너에 어떤 Xcode 가 깔려 있는지만 본다 (1~2분).
# 애플이 "iOS 26 SDK 이상으로 지은 것만 받는다"고 거절해서, 어느 판을 쓸 수 있는지 먼저 확인한다.
name: Xcode 확인
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        img: [macos-26, macos-15, macos-latest]
    runs-on: ${{ matrix.img }}
    steps:
      - run: |
          echo "이미지: ${{ matrix.img }}"
          sw_vers
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

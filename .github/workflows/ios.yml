# =====================================================================
# 「우리 모임」 아이폰 빌드 → App Store Connect(TestFlight) 업로드
# ---------------------------------------------------------------------
# 맥이 없어도 GitHub 의 맥 러너를 빌려 IPA 를 만든다.
# 실행: 저장소 → Actions → "iOS 빌드" → Run workflow
#
# ⚠️ 미리 저장소 Settings → Secrets and variables → Actions 에 5가지가 있어야 한다
#    (열쇠·비밀번호는 사장님이 직접 넣는다 — 값은 C:\unse-build\credentials\ 에 있다):
#      ASC_KEY_ID        = 8SVHXRL56W
#      ASC_ISSUER_ID     = dfe42600-d0e5-41f1-8e77-48ce0c98a53e
#      ASC_PRIVATE_KEY   = AuthKey_8SVHXRL56W.p8 파일 내용 전체
#      DIST_P12_BASE64   = dist.p12 를 base64 로 바꾼 글자
#      DIST_P12_PASSWORD = dist.p12 의 비밀번호
#
# ⚠️ 스크린샷도 여기서 찍는다 — 애플은 아이폰 규격(6.7인치 1290×2796)을 요구하는데
#    안드로이드 화면을 늘려 쓰면 상태바·비율이 어긋난다. 시뮬레이터에서 «진짜»를 찍는다.
# =====================================================================
name: iOS 빌드

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: '스크린샷도 찍기 (시뮬레이터)'
        type: boolean
        default: true
      upload:
        description: 'TestFlight 에 올리기 (끄면 스크린샷만 찍는다)'
        type: boolean
        default: true

jobs:
  build:
    # ⚠️ macos-15 를 쓰면 안 된다 — 거기 있는 Xcode 는 16.4(iOS 18.5 SDK)뿐이라
    #    애플이 업로드를 거절한다: "iOS 26 SDK 이상으로 지은 것만 받는다"(409).
    #    macos-26 에는 Xcode 26.x 가 있다.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 판 고르기 (가장 새것)
        # 애플은 «가장 새 SDK»로 지은 것만 받는다. 기본값이 옛 판일 수 있어 여기서 못 박는다.
        run: |
          NEW=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "고른 Xcode: $NEW"
          sudo xcode-select -s "$NEW"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS " || true

      # ⚠️ 판(version)을 못 박는다.
      #    «최신 stable»로 두었더니 3.47 이 CocoaPods 대신 Swift Package Manager 로 갈아타면서
      #    "The sandbox is not in sync with the Podfile.lock" 로 빌드가 멈췄다.
      #    이 앱을 실제로 만들고 안드로이드까지 낸 판이 3.44.5 다 — 같은 판으로 짓는다.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      # ⚠️ Swift Package Manager 를 끈다.
      #    켜져 있으면 Flutter 가 라이브러리를 SPM 으로 가져가면서 Podfile 은 «빈 채»로 남는데,
      #    Xcode 안에는 CocoaPods 검사(Check Pods Manifest.lock)가 그대로 있어
      #    "The sandbox is not in sync with the Podfile.lock" 로 빌드가 멈춘다.
      #    이 프로젝트는 Podfile 에 최소버전·권한 매크로 같은 설정이 들어 있으므로 CocoaPods 쪽을 쓴다.
      - name: Swift Package Manager 끄기
        run: flutter config --no-enable-swift-package-manager

      - name: 패키지 받기
        run: flutter pub get

      - name: 코드 점검 (오류·경고 있으면 여기서 멈춤)
        # ⚠️ `--no-fatal-infos` 가 없으면 «정보»(스타일 제안)까지 실패로 쳐서 빌드가 멈춘다.
        #    우리는 오류·경고 0을 지키고, 스타일 제안은 막지 않는다.
        run: flutter analyze lib --no-fatal-infos

      - name: 계산 로직 시험
        run: flutter test

      # ── 📸 스크린샷: 시뮬레이터에서 «체험 모드»로 찍는다 ───────────────
      # 심사원이 보는 것과 같은 화면이라 스토어 자료로 그대로 쓸 수 있다.
      - name: 시뮬레이터 준비
        if: ${{ inputs.screenshots }}
        run: |
          xcrun simctl list devices available | head -40
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          cand={}
          for rt,ds in d.items():
              if 'iOS' not in rt: continue
              for x in ds:
                  cand[x['name']] = x['udid']
          for want in ('iPhone 17 Pro Max','iPhone 16 Pro Max','iPhone 15 Pro Max','iPhone 16 Plus'):
              if want in cand:
                  print(cand[want]); raise SystemExit
          ")
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: 시뮬레이터에서 앱 실행 + 스크린샷
        if: ${{ inputs.screenshots }}
        run: |
          # SHOTS=true 로 지으면 앱이 스스로 체험 모임을 세우고 10초마다 다음 탭으로 넘어간다.
          # («1» 로 주면 안 켜진다 — bool.fromEnvironment 는 «true» 만 참으로 읽는다)
          # 그래서 여기서는 «좌표를 누르지 않고» 시간만 재서 찍는다 — 기기가 바뀌어도 안 어긋난다.
          flutter build ios --simulator --debug --dart-define=SHOTS=true
          APP=$(find build/ios/iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl launch "$SIM_UDID" "$BUNDLE"
          mkdir -p raw shots
          # ⚠️ 시각을 맞추려 들지 않는다. 앱이 서는 시간이 판마다 달라 몇 초만 어긋나면
          #    같은 화면이 두 장 찍힌다. 계속 찍어 두고 «똑같은 그림끼리» 묶어 고른다.
          #    ⚠️ 골라내기가 어긋나도 **원본은 반드시 남긴다** — 안 남기면 왜 어긋났는지
          #       알 길이 없어 50분짜리 판을 또 돌려야 한다(2026-08-25 실제로 그랬다).
          for i in $(seq -w 1 60); do
            xcrun simctl io "$SIM_UDID" screenshot "raw/$i.png" >/dev/null 2>&1 || true
            sleep 2
          done
          ls raw | wc -l
          python3 tool/pick_shots.py || echo '골라내기 실패 — 원본은 남겼다'

      - name: 스크린샷 보관 (고른 것)
        if: ${{ always() && inputs.screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots/*.png
          if-no-files-found: ignore

      - name: 스크린샷 보관 (원본 전부)
        if: ${{ always() && inputs.screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-raw
          path: raw/*.png
          if-no-files-found: ignore

      # ── 🍎 서명 → 아카이브 → IPA → 업로드 ────────────────────────────
      - name: 배포 인증서 설치 (계정 공용 dist.p12)
        if: ${{ inputs.upload }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DIST_P12_BASE64 }}
          p12-password: ${{ secrets.DIST_P12_PASSWORD }}

      - name: 프로비저닝 프로파일 받기
        if: ${{ inputs.upload }}
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: com.taejinsoft.woorimoim
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: 빌드 번호 = 실행 번호
        if: ${{ inputs.upload }}
        # ⚠️ 같은 빌드 번호를 두 번 올리면 애플이 거절한다. 실행 번호를 그대로 쓴다.
        run: |
          cd ios
          agvtool new-version -all ${{ github.run_number }}

      - name: 아카이브
        if: ${{ inputs.upload }}
        # ⚠️ 서명 설정은 여기(명령줄)가 아니라 **Runner 대상의 Release 설정**에 박아 두었다.
        #    명령줄로 주면 Pods 의 라이브러리 대상까지 걸려
        #    "PromisesObjC does not support provisioning profiles" 로 통째로 멈춘다.
        #    (러너에는 Xcode 로그인 계정이 없어 자동 서명은 애초에 못 쓴다)
        run: |
          flutter build ios --release --no-codesign
          xcodebuild archive             -workspace ios/Runner.xcworkspace             -scheme Runner             -configuration Release             -archivePath build/ios/archive/Runner.xcarchive             -destination 'generic/platform=iOS'

      - name: IPA 내보내기
        if: ${{ inputs.upload }}
        run: |
          cat > ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>593WGP65C8</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.taejinsoft.woorimoim</key><string>WooriMoim AppStore</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive             -archivePath build/ios/archive/Runner.xcarchive             -exportPath build/ipa             -exportOptionsPlist ExportOptions.plist
          ls -la build/ipa

      - name: App Store Connect 업로드 (TestFlight)
        if: ${{ inputs.upload }}
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -f build/ipa/*.ipa -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      - name: IPA 보관
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: woorimoim-ipa
          path: build/ipa/*.ipa
